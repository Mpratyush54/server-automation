apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: public-portal
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Mpratyush54/server-automation.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
