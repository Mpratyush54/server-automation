apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: platform
  labels:
    app: platform-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-api
  template:
    metadata:
      labels:
        app: platform-api
    spec:
      serviceAccountName: platform-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/mpratyush54/platform-api:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          # No hostPath: config and keys come from Secrets (platform-credentials
          # wins over platform-env on duplicate keys), so the pod can run on any node.
          envFrom:
            - secretRef:
                name: platform-env
            - secretRef:
                name: platform-credentials
