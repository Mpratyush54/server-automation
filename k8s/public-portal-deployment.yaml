apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-portal
  namespace: platform
  labels:
    app: public-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: public-portal
  template:
    metadata:
      labels:
        app: public-portal
    spec:
      containers:
      - name: public-portal
        image: ghcr.io/mpratyush54/platform-portal-public:latest
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /health
            port: 80
        readinessProbe:
          httpGet:
            path: /health
            port: 80
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
