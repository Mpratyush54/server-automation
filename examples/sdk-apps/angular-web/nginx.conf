server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Browser RUM config, rewritten at container start (see rum-config.sh); never cached.
  location = /rum-config.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
