apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdk-demo
  labels:
    app: sdk-demo
    app.kubernetes.io/name: sdk-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sdk-demo
  template:
    metadata:
      labels:
        app: sdk-demo
    spec:
      containers:
        - name: app
          # Public image so GitOps sync becomes Ready without a private registry.
          image: hashicorp/http-echo:1.0
          args:
            - "-text=hello-from-github-sdk-demo"
            - "-listen=:8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
