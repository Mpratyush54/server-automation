<div class="min-h-screen flex items-center justify-center p-4 bg-app" style="background-image: radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.15) 0px, transparent 50%); min-height: 100vh;">
  <div class="card w-full max-w-md p-8" style="background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-glass); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border-radius: 24px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);">
    
    <div class="text-center mb-8">
      <h2 style="font-size: 2.25rem; font-weight: 800; background: linear-gradient(135deg, #a78bfa, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; border-bottom: none; padding-bottom: 0; margin-bottom: 8px; letter-spacing: -0.04em;">Platform</h2>
      <p style="color: var(--color-text-secondary); font-size: 0.95rem; margin: 0;">Self-hosted internal PaaS Control Center</p>
    </div>



    <!-- Password Login Mode -->
    <div>
      <div class="form-group mb-4">
        <label>Email or username</label>
        <input type="text" [(ngModel)]="email" placeholder="john@pratyushes.dev or john" (keyup.enter)="login()" style="width: 100%; box-sizing: border-box;" autocomplete="username">
      </div>
      <div class="form-group mb-6" style="position: relative;">
        <label>Password</label>
        <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" placeholder="Enter your password" (keyup.enter)="login()" style="width: 100%; box-sizing: border-box; padding-right: 44px;" autocomplete="current-password">
        <button (click)="showPassword = !showPassword" style="position: absolute; right: 12px; top: 36px; background: none; border: none; cursor: pointer; color: var(--color-text-muted); padding: 4px;">
          <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
        </button>
      </div>
    </div>



    <div *ngIf="errorMessage" class="mb-4 p-3 text-sm text-red-400 bg-red-950/20 border border-red-900/50 rounded-xl text-center">
      {{ errorMessage }}
    </div>

    <button class="btn btn-primary w-full mb-4" (click)="login()" [disabled]="loading || !email || !password" style="display: flex; width: 100%; justify-content: center; align-items: center; gap: 8px; box-sizing: border-box;">
      <svg *ngIf="loading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 16px; height: 16px; animation: spin 1s linear infinite;"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
      {{ loading ? 'Signing in...' : 'Sign In' }}
    </button>

    <div class="flex items-center my-6">
      <hr class="flex-grow border-t border-glass" style="border-color: var(--border-glass);">
      <span class="px-3 text-xs text-muted uppercase" style="color: var(--color-text-muted);">or continue with</span>
      <hr class="flex-grow border-t border-glass" style="border-color: var(--border-glass);">
    </div>

    <button class="btn w-full" (click)="loginWithGitLab()" style="display: flex; width: 100%; justify-content: center; box-sizing: border-box; background: rgba(226, 67, 41, 0.1); border-color: rgba(226, 67, 41, 0.2); color: #fff;">
      <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24" style="width: 20px; height: 20px;">
        <path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/>
      </svg>
      Sign In with GitLab
    </button>

  </div>
</div>

<style>
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
</style>
