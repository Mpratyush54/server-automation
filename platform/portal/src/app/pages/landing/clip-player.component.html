@if (feature.media; as media) {
  @if (staticPage) {
    <!-- No JavaScript: the browser's own controls are the only way to play. -->
    <video controls muted loop playsinline preload="none" crossorigin="anonymous"
      width="1280" height="800" [poster]="media.poster" [attr.aria-label]="'Recording: ' + feature.title + ' ' + feature.subtitle">
      <source [src]="media.webm" type="video/webm" />
      <source [src]="media.mp4" type="video/mp4" />
      <track [src]="media.captions" kind="captions" srclang="en" label="English" />
    </video>
  } @else {
    <div #root class="cp" tabindex="0" role="group"
      [class.cp-started]="started" [class.cp-playing]="playing" [class.cp-paused]="started && !playing"
      [class.cp-seeking]="seeking" [class.cp-fullscreen]="fullscreen"
      [attr.aria-label]="'Recording: ' + feature.title + ' ' + feature.subtitle"
      (keydown)="onKeydown($event)">
      @if (near) {
        <video #video muted loop playsinline preload="none" crossorigin="anonymous" tabindex="-1"
          width="1280" height="800" [poster]="media.poster" aria-hidden="true"
          (click)="togglePlay()" (play)="onPlay()" (playing)="onPlaying()" (pause)="onPause()" (waiting)="onWaiting()"
          (timeupdate)="onTime()" (loadedmetadata)="onMeta()" (durationchange)="onMeta()">
          <source [src]="media.webm" type="video/webm" />
          <source [src]="media.mp4" type="video/mp4" (error)="onError()" />
          <track [src]="media.captions" kind="captions" srclang="en" label="English" />
        </video>
      }

      @if (showCaption) {
        <p class="cp-caption" aria-hidden="true"><span>{{ caption }}</span></p>
      }

      @if (loading && !error) {
        <span class="cp-loading" role="status" aria-label="Loading the clip"></span>
      }

      @if (showPlay && near) {
        <button type="button" class="cp-play" (click)="play(true)" [attr.aria-label]="'Play the recording: ' + feature.title">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"></path></svg>
        </button>
      }

      @if (error) {
        <p class="cp-error" role="alert">{{ error }}</p>
      }

      @if (started) {
        <div class="cp-bar">
          <button type="button" class="cp-btn" (click)="togglePlay()" [attr.aria-label]="playing ? 'Pause' : 'Play'" [attr.title]="playing ? 'Pause (k)' : 'Play (k)'">
            @if (playing) {
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"></path></svg>
            } @else {
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"></path></svg>
            }
          </button>
          <div #seek class="cp-seek" role="slider" tabindex="0" aria-label="Seek"
            aria-valuemin="0" [attr.aria-valuemax]="duration.toFixed(0)" [attr.aria-valuenow]="current.toFixed(0)" [attr.aria-valuetext]="seekText"
            (pointerdown)="onSeekPointerDown($event)" (pointermove)="onSeekPointerMove($event)"
            (pointerup)="onSeekPointerUp($event)" (pointercancel)="onSeekPointerUp($event)">
            <span class="cp-track"><span class="cp-fill" [style.transform]="'scaleX(' + progress + ')'"></span></span>
            <span class="cp-thumb" [style.left.%]="progress * 100"></span>
          </div>
          <span class="cp-time" aria-hidden="true">{{ timeText }}</span>
          <button type="button" class="cp-btn cp-cc" (click)="toggleCaptions()" [attr.aria-pressed]="captionsOn"
            aria-label="Captions" title="Captions (c)">
            <svg class="cp-stroke" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2.5"></rect><path d="M10.5 10.2a2.2 2.2 0 1 0 0 3.6M17 10.2a2.2 2.2 0 1 0 0 3.6"></path></svg>
          </button>
          <button type="button" class="cp-btn" (click)="toggleFullscreen()"
            [attr.aria-label]="fullscreen ? 'Exit full screen' : 'Full screen'" [attr.title]="fullscreen ? 'Exit full screen (f)' : 'Full screen (f)'">
            @if (fullscreen) {
              <svg class="cp-stroke" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"></path></svg>
            } @else {
              <svg class="cp-stroke" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg>
            }
          </button>
        </div>
      }
    </div>
  }
}
