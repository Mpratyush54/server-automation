<div class="page-header">
  <div>
    <h1 class="page-title">Logs</h1>
    <p class="page-subtitle">Search a project's stored log lines by service, level or keyword.</p>
  </div>
</div>

<section class="card lg-section" aria-labelledby="lg-search">
  <h2 id="lg-search">Search logs</h2>
  <div class="lg-form">
    <div class="form-group"><label for="lg-project">Project ID</label><input id="lg-project" [(ngModel)]="query.projectId" autocomplete="off"></div>
    <div class="form-group"><label for="lg-service">Service name</label><input id="lg-service" [(ngModel)]="query.serviceName" autocomplete="off"></div>
    <div class="form-group"><label for="lg-level">Level</label><select id="lg-level" [(ngModel)]="query.level"><option value="">All</option><option>info</option><option>warn</option><option>error</option><option>debug</option></select></div>
    <div class="form-group"><label for="lg-q">Search</label><input id="lg-q" [(ngModel)]="query.search" placeholder="Keyword"></div>
  </div>
  <button type="button" class="btn btn-primary" (click)="search()" [disabled]="!query.projectId">Search</button>
</section>

@if (logs.length) {
  <section class="card card-flush" aria-labelledby="lg-results">
    <div class="card-header"><h2 id="lg-results">Results</h2><span class="badge">{{ total }}</span></div>
    <ul class="lg-list">
      @for (l of logs; track l) {
        <li>
          <div class="lg-meta">
            <span class="muted">{{ l.timestamp | date:'medium' }}</span>
            <span class="badge" [class.badge-failed]="l.level === 'error'">{{ l.level }}</span>
            <span class="lg-service">{{ l.serviceName }}</span>
          </div>
          <div class="lg-msg mono">{{ l.message }}</div>
        </li>
      }
    </ul>
  </section>
}
