server {
    listen 80;
    server_name platform.pratyushes.dev;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Favicons change rarely but browsers/CDN cache aggressively — short TTL + revalidate
    location ~* ^/(favicon|platform-favicon|apple-touch-icon).*\.(ico|png)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }

    location = /docs/index.md {
        default_type text/markdown;
        add_header Link '<https://platform.pratyushes.dev/docs>; rel="canonical"';
        try_files $uri =404;
    }

    location ~ ^/docs/(?<doc_path>.+)\.md$ {
        default_type text/markdown;
        add_header Link '<https://platform.pratyushes.dev/docs/$doc_path>; rel="canonical"';
        try_files $uri =404;
    }

    location ~ \.md$ {
        default_type text/markdown;
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /llms.txt {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /llms-full.txt {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=86400";
        add_header Cloudflare-CDN-Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    # Angular names bundles by content, so each deployment has new cache keys.
    location ~* "^/[^/]+-[a-z0-9]{8,}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cloudflare-CDN-Cache-Control "public, max-age=31536000";
        try_files $uri =404;
    }

    location /media/ {
        types {
            video/mp4 mp4;
            image/jpeg jpg jpeg;
            text/vtt vtt;
        }
        # Player URLs include a content-derived version. Keep Range/Content-Length
        # intact for seeking and let Cloudflare retain cacheable media for a week.
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
        add_header Cloudflare-CDN-Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    location /prerender/ {
        internal;
    }

    location / {
        # Docs routes overlap physical Markdown directories. Only serve files;
        # matching a directory would redirect to a slash and return 403.
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri /prerender$uri/index.html /index.html;
    }
}
