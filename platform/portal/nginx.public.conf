server {
    listen 80;
    server_name platform.pratyushes.dev;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Favicons change rarely but browsers/CDN cache aggressively — short TTL + revalidate
    location ~* ^/(favicon|platform-favicon|apple-touch-icon).*\.(ico|png)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }

    location ~ \.md$ {
        default_type text/markdown;
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /llms.txt {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location = /llms-full.txt {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
