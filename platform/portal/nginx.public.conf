server {
    listen 80;
    server_name platform.pratyushes.dev;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. nginx only inherits add_header into a location that
    # sets no add_header of its own, so every location below that adds a
    # cache/Link header repeats this block (the "# security headers" lines).
    # `always` keeps them on 404s and redirects.
    # - scripts: same-origin bundles only; prerendered pages contain only
    #   inline <style> and a JSON-LD data block (not executed).
    # - styles: Angular component styles / style="" need 'unsafe-inline'.
    # - fonts: Google Fonts; media: self-hosted /media/ videos and captions.
    # - frame-ancestors 'none': the marketing site is never embedded.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-src 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # The marketing page has one canonical URL. Preserve query strings and let
    # browsers carry an existing fragment across the HTTP redirect.
    location = /landing {
        add_header Cache-Control "no-store";
        add_header Cloudflare-CDN-Cache-Control "no-store";
        # security headers (repeated: add_header is not inherited here)
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-src 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
        return 308 /$is_args$args;
    }

    location = /landing/ {
        add_header Cache-Control "no-store";
        add_header Cloudflare-CDN-Cache-Control "no-store";
        # security headers (repeated: add_header is not inherited here)
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-src 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
        return 308 /$is_args$args;
    }

    # Favicons change rarely but browsers/CDN cache aggressively — short TTL + revalidate
    location ~* ^/(favicon|platform-favicon|apple-touch-icon).*\.(ico|png)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        # security headers (repeated: add_header is not inherited here)
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-src 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
        try_files $uri =404;
    }

    location = /docs/index.md {
        default_type text/markdown;
        add_header Link '<https://platform.pratyushes.dev/docs>; rel="canonical"';
        # security headers (repeated: add_header is not inherited here)
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-src 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
        try_files $uri =404;
    }

    location ~ ^/docs/(?<doc_path>.+)\.md$ {
        default_type text/markdown;
        add_header Link '<https://platform.pratyushes.dev/docs/$doc_path>; rel="canonical"';
        # security headers (repeated: add_header is not inherited here)
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-src 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
        try_files $uri =404;
    }

    location ~ \.md$ {
        default_type text/markdown;
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        # security headers (repeated: add_header is not inherited here)
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-src 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
        # security headers (repeated: add_header is not inherited here)
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-src 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
        try_files $uri =404;
    }

    location = /docs-search.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        # security headers (repeated: add_header is not inherited here)
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-src 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
        try_files $uri =404;
    }

    location = /llms.txt {
        add_header Cache-Control "public, max-age=3600";
        # security headers (repeated: add_header is not inherited here)
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-src 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
        try_files $uri =404;
    }

    location = /llms-full.txt {
        add_header Cache-Control "public, max-age=3600";
        # security headers (repeated: add_header is not inherited here)
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-src 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=86400";
        add_header Cloudflare-CDN-Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        # security headers (repeated: add_header is not inherited here)
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-src 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
        try_files $uri =404;
    }

    # Angular names bundles by content, so each deployment has new cache keys.
    location ~* "^/[^/]+-[a-z0-9]{8,}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cloudflare-CDN-Cache-Control "public, max-age=31536000";
        # security headers (repeated: add_header is not inherited here)
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-src 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
        try_files $uri =404;
    }

    location /media/ {
        types {
            video/mp4 mp4;
            image/jpeg jpg jpeg;
            text/vtt vtt;
        }
        # Player URLs include a content-derived version. Keep Range/Content-Length
        # intact for seeking and let Cloudflare retain cacheable media for a week.
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
        add_header Cloudflare-CDN-Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        # security headers (repeated: add_header is not inherited here)
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-src 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
        try_files $uri =404;
    }

    location /prerender/ {
        internal;
    }

    location / {
        # Docs routes overlap physical Markdown directories. Only serve files;
        # matching a directory would redirect to a slash and return 403.
        add_header Cache-Control "no-store";
        add_header Cloudflare-CDN-Cache-Control "no-store";
        # security headers (repeated: add_header is not inherited here)
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-src 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
        try_files $uri /prerender$uri/index.html /index.html;
    }
}
