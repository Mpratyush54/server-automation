server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    # The container listens on 8080 behind the ingress: never build redirects from
    # the internal scheme/port (a /docs -> http://host:8080/docs/ redirect leaked it).
    absolute_redirect off;

    # Security headers. nginx only inherits add_header into a location that
    # sets no add_header of its own, so any location that adds a header must
    # repeat this whole block (see /api/ below). `always` keeps them on 4xx/5xx.
    # - scripts: same-origin bundles only (the production build disables the
    #   inline onload handler Angular's critical-CSS inlining would emit).
    # - styles: Angular injects component styles as <style> and templates use
    #   style="" attributes, so 'unsafe-inline' is required for styles only.
    # - fonts: Google Fonts (inlined @font-face pointing at fonts.gstatic.com).
    # - images: https: for GitHub/GitLab avatars.
    # - frames: Grafana / Argo CD / Portainer are embedded from this origin.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; form-action 'self' https://github.com; frame-ancestors 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;

    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # API responses are JSON or user-uploaded files (/api/storage): never
        # let them run script or be framed by other origins. Hide upstream
        # copies so the browser does not see two conflicting policies.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
    }

    location / {
        # No directory fallback: /docs (a folder of Markdown in the build) is an SPA route.
        try_files $uri /index.html;
    }
}
