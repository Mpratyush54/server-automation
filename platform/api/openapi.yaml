openapi: 3.0.3
info:
  title: Platform PaaS API
  version: 1.0.0
  description: |
    Internal Platform API including AI-first MCP agent tokens and guarded command execution.
servers:
  - url: /api
    description: Platform API base
tags:
  - name: Health
  - name: Auth
  - name: MFA
  - name: AgentTokens
  - name: AgentCommands
  - name: Projects
  - name: Settings
  - name: Notifications
paths:
  /projects/{projectId}/argocd/refresh:
    post:
      tags: [Projects]
      summary: Request ArgoCD hard refresh (audited)
      description: Requires project developer membership or global admin/devops. Application names are server-selected. Sync never overwrites an active operation.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                env: { type: string, default: development }
      responses:
        '202':
          description: Action accepted; poll argocd-status for progress
        '401':
          description: Authentication required
        '403':
          description: Project developer membership required
        '404':
          description: Project, environment or Application not found
        '409':
          description: Concurrent modification or sync already running
        '502':
          description: Kubernetes request failed
  /projects/{projectId}/argocd/sync:
    post:
      tags: [Projects]
      summary: Request ArgoCD sync (audited)
      description: Requires project developer membership or global admin/devops. Application names are server-selected. Sync never overwrites an active operation.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                env: { type: string, default: development }
      responses:
        '202':
          description: Action accepted; poll argocd-status for progress
        '401':
          description: Authentication required
        '403':
          description: Project developer membership required
        '404':
          description: Project, environment or Application not found
        '409':
          description: Concurrent modification or sync already running
        '502':
          description: Kubernetes request failed
  /projects/{projectId}/argocd-status:
    get:
      tags: [Projects]
      summary: Read project ArgoCD status, conditions and operation errors
      security:
        - bearerAuth: []
        - agentTokenAuth: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string }
        - in: query
          name: env
          schema: { type: string, default: development }
      responses:
        '200':
          description: Connection state; when connected includes branch, sync.revision, conditions, operationState phase/message and resources counts (total, synced, outOfSync, healthy, degraded). Existing revision and syncStatus fields are preserved.
        '403':
          description: Project viewer membership or projects:read agent scope required
        '404':
          description: Project or environment not found
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness check (PostgreSQL reachable, not draining; Redis reported but not required)
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  checks:
                    type: object
                    properties:
                      db:
                        type: string
                        example: ok
                      redis:
                        type: string
                        example: ok
        '503':
          description: PostgreSQL unavailable, or draining
  /openapi.json:
    get:
      tags: [Health]
      summary: OpenAPI document
      security: []
      responses:
        '200':
          description: OpenAPI 3 document
  /auth/login:
    post:
      tags: [Auth]
      summary: Password login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                email:
                  type: string
                username:
                  type: string
                password:
                  type: string
                  format: password
      description: |
        Password login. Outcomes:
        - MFA enabled: `{ mfa_required: true, challengeToken, expiresIn }` (no session yet);
          complete with POST /auth/mfa/challenge.
        - Role listed in `mfa.requiredRoles` (default admin, devops) without MFA: a session restricted
          to enrolment (`mfaEnrollmentRequired: true`; other endpoints answer 403 `mfa_enrollment_required`).
        - Otherwise `{ token, user }`. Session JWTs carry `amr` and `auth_time`.
      responses:
        '200':
          description: Session issued, or MFA challenge required
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginSession'
                  - $ref: '#/components/schemas/MfaChallengeRequired'
        '401':
          description: Invalid credentials
  /auth/exchange:
    post:
      tags: [Auth]
      summary: Swap the one-time GitHub/GitLab login code for a session (or an MFA challenge)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        '200':
          description: Same outcomes as POST /auth/login (`amr` is `fed`)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginSession'
                  - $ref: '#/components/schemas/MfaChallengeRequired'
        '400':
          description: Invalid, expired or reused code
  /auth/mfa/challenge:
    post:
      tags: [MFA]
      summary: Complete a login with a TOTP code or a recovery code
      description: Rate-limited per account (failures only, shared across replicas). TOTP codes and recovery codes are accepted once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, code]
              properties:
                challengeToken:
                  type: string
                code:
                  type: string
                  description: 6-digit TOTP code or a recovery code (xxxxx-xxxxx)
      responses:
        '200':
          description: Session issued (`amr` includes `otp` and `mfa`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSession'
        '401':
          description: '`invalid_challenge` (expired/forged) or `invalid_code` (wrong, reused or replayed code)'
        '429':
          description: Too many failed attempts
  /auth/mfa/status:
    get:
      tags: [MFA]
      summary: MFA state of the current user and the policy that applies
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  pending: { type: boolean }
                  enabledAt: { type: string, format: date-time, nullable: true }
                  recoveryCodesRemaining: { type: integer }
                  required: { type: boolean }
                  requiredRoles: { type: array, items: { type: string } }
                  stepUpMaxAgeSec: { type: integer }
  /auth/mfa/enroll:
    post:
      tags: [MFA]
      summary: Start TOTP enrolment (allowed on an enrolment-only session)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  otpauthUri: { type: string, example: 'otpauth://totp/Platform:admin%40example.com?secret=...' }
                  qrDataUrl: { type: string, description: PNG data URL of the otpauth URI }
                  secret: { type: string, description: Base32 secret for manual entry }
                  issuer: { type: string }
        '409':
          description: MFA already enabled
  /auth/mfa/verify:
    post:
      tags: [MFA]
      summary: Confirm enrolment with the first code; returns recovery codes (shown once) and a full session
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCode'
      responses:
        '200':
          description: Enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  recoveryCodes: { type: array, items: { type: string }, minItems: 10, maxItems: 10 }
                  token: { type: string }
                  user: { type: object }
        '400':
          description: invalid_code / no_pending_enrollment
  /auth/mfa/step-up:
    post:
      tags: [MFA]
      summary: Re-verify the second factor; returns a session whose auth_time is now
      description: Needed by step-up protected endpoints (secret reveal/export, platform secret rotation, agent-token creation, admin MFA reset, MFA policy).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCode'
      responses:
        '200':
          description: New session token
        '400':
          description: invalid_code / mfa_not_enrolled
        '429':
          description: Too many failed attempts
  /auth/mfa/recovery-codes:
    post:
      tags: [MFA]
      summary: Regenerate the 10 recovery codes (old codes stop working)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCode'
      responses:
        '200':
          description: New codes (shown once)
        '400':
          description: invalid_code / mfa_not_enrolled
  /auth/mfa/disable:
    post:
      tags: [MFA]
      summary: Remove the authenticator (requires a current code)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaCode'
      responses:
        '200':
          description: Disabled
        '400':
          description: invalid_code / mfa_not_enrolled
        '403':
          description: mfa_required_by_policy (role is in mfa.requiredRoles)
  /users/{id}/mfa/reset:
    post:
      tags: [MFA]
      summary: Admin reset of another user's MFA (audit-logged; needs a recent admin second factor)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Reset
        '401':
          $ref: '#/components/responses/StepUpRequired'
        '403':
          description: Not an admin
  /settings/mfa:
    get:
      tags: [MFA, Settings]
      summary: Policy mfa.requiredRoles (default [admin, devops])
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Policy
    put:
      tags: [MFA, Settings]
      summary: Update mfa.requiredRoles (admin, recent second factor)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requiredRoles]
              properties:
                requiredRoles:
                  type: array
                  items:
                    type: string
                    enum: [admin, devops, tech_lead, developer, viewer]
      responses:
        '200':
          description: Saved
        '401':
          $ref: '#/components/responses/StepUpRequired'
  /projects/{projectId}/secrets/reveal:
    post:
      tags: [Projects]
      summary: Reveal a secret value (audit-logged; step-up)
      security:
        - bearerAuth: []
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string }
                environmentId: { type: string, nullable: true }
      responses:
        '200':
          description: Plaintext value
        '401':
          $ref: '#/components/responses/StepUpRequired'
  /projects/{projectId}/secrets/export/{environmentId}:
    get:
      tags: [Projects]
      summary: Export secrets as .env (audit-logged; step-up)
      security:
        - bearerAuth: []
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: environmentId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: .env lines
        '401':
          $ref: '#/components/responses/StepUpRequired'
  /projects/{projectId}/environment:
    get:
      tags: [Projects]
      summary: Merged environment variables (plain config + secrets) for the Environment tab
      description: |
        Rows `{key, type: plain|secret, value, masked, environmentId, scope, version, updatedBy, updatedAt, secretId, conflict}`.
        Secret values are always null (reveal via POST /projects/{projectId}/secrets/reveal). Plain values are null for
        viewers and agent tokens (keys and types only). `environmentId` omitted = every scope; `global` = global rows
        only; an environment id or name = global rows plus rows for that environment. `conflict` marks a key stored as
        both plain and secret in the same scope.
      security:
        - bearerAuth: []
        - agentTokenAuth: []
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: environmentId, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: '`{ projectId, environmentId, environment, capabilities, conflicts, variables }`'
        '403':
          description: Not a member of the project
  /projects/{projectId}/environment/{key}:
    put:
      tags: [Projects]
      summary: Set a variable as plain config or encrypted secret (moves it between stores in one transaction)
      description: |
        `secret: true` writes the secret store (secrets.create; config.update too when a plain value is moved) and deletes
        the plain row in the same transaction. `secret: false` writes config (config.update); converting an existing
        secret to plain also needs secrets.delete + secrets.reveal and a recent MFA step-up. Omit `value` to convert
        while keeping the stored value. Audit-logged; values are never logged.
      security:
        - bearerAuth: []
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: key, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_.-]{0,199}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                environmentId: { type: string, nullable: true, description: 'null / omitted = global (all environments)' }
                value: { type: string }
                secret: { type: boolean }
      responses:
        '200':
          description: Updated `{ key, type, environmentId, status, convertedFrom, version, secretId }`
        '201':
          description: Created
        '401':
          $ref: '#/components/responses/StepUpRequired'
        '403':
          description: Missing permission or project role
    delete:
      tags: [Projects]
      summary: Delete one variable from the plain or secret store (audit-logged)
      security:
        - bearerAuth: []
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: type, in: query, required: true, schema: { type: string, enum: [plain, secret] } }
        - { name: environmentId, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Deleted
        '404':
          description: Not found
  /config:
    get:
      tags: [Projects]
      deprecated: true
      summary: Flat config map (deprecated; use GET /projects/{projectId}/environment). Kept for SDK/CLI compatibility.
      security:
        - bearerAuth: []
      parameters:
        - { name: projectId, in: query, required: true, schema: { type: string } }
        - { name: environmentId, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: '`{ KEY: value }` (secrets masked unless the caller holds secrets.reveal and has a recent MFA step-up; reveals are audited)'
          headers:
            X-Secrets-Masked:
              description: '`step-up-required` when the caller holds secrets.reveal but secrets were masked for lack of a recent MFA step-up (POST /api/auth/mfa/step-up, then retry).'
              schema: { type: string }
    post:
      tags: [Projects]
      deprecated: true
      summary: Upsert a plain config value (deprecated; use PUT /projects/{projectId}/environment/{key})
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Saved
    delete:
      tags: [Projects]
      deprecated: true
      summary: Delete a plain config value (deprecated; use DELETE /projects/{projectId}/environment/{key}?type=plain)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Deleted
  /projects/{projectId}/secrets:
    get:
      tags: [Projects]
      deprecated: true
      summary: List secrets, values masked (deprecated; use GET /projects/{projectId}/environment)
      security:
        - bearerAuth: []
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Masked secrets
    post:
      tags: [Projects]
      deprecated: true
      summary: Create or update a secret (deprecated; use PUT /projects/{projectId}/environment/{key} with secret=true)
      security:
        - bearerAuth: []
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201':
          description: Saved
  /auth/providers:
    get:
      tags: [Auth]
      summary: Public GitHub/GitLab login availability
      security: []
      responses:
        '200':
          description: Provider flags
  /auth/github:
    get:
      tags: [Auth]
      summary: Start GitHub OAuth login
      security: []
      responses:
        '302':
          description: Redirect to GitHub
  /auth/gitlab:
    get:
      tags: [Auth]
      summary: Start GitLab OAuth login
      security: []
      responses:
        '302':
          description: Redirect to GitLab
  /users/me:
    get:
      tags: [Auth]
      summary: Current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile
    patch:
      tags: [Auth]
      summary: Update name and avatar
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Updated profile
  /notifications:
    get:
      tags: [Notifications]
      summary: List current user notifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Inbox
  /settings/integrations:
    get:
      tags: [Settings]
      summary: GitHub/GitLab OAuth apps and linking tokens
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Masked integration settings
    put:
      tags: [Settings]
      summary: Save GitHub/GitLab login and linking credentials
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Saved
  /settings/integrations/git:
    get:
      tags: [Settings]
      summary: GitHub App / GitLab OAuth app connection status and health (never returns secrets)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Per-provider status, callback/webhook URLs, reachability warnings
  /settings/integrations/github/manifest:
    post:
      tags: [Settings]
      summary: Start the GitHub App Manifest flow (admin, MFA step-up); returns the manifest, a one-time state and the GitHub URL to post it to
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ownerType: { type: string, enum: [user, org] }
                org: { type: string }
                name: { type: string, maxLength: 34 }
      responses:
        '200':
          description: manifest, state, postUrl, expiresInSec
        '401':
          $ref: '#/components/responses/StepUpRequired'
  /settings/integrations/github/manifest/complete:
    post:
      tags: [Settings]
      summary: Finish the manifest flow; converts the code and stores the App credentials encrypted (admin, MFA step-up)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code: { type: string }
                state: { type: string }
      responses:
        '200':
          description: Connected; includes the installation URL
        '400':
          description: Unknown, expired or reused state
        '403':
          description: State issued to a different user
  /settings/integrations/github/installations:
    get:
      tags: [Settings]
      summary: GitHub App installations with their repositories and mapped projects
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Installations
  /settings/integrations/github/installations/sync:
    post:
      tags: [Settings]
      summary: Re-read installations from GitHub (admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Installations
  /settings/integrations/github/repositories:
    get:
      tags: [Settings]
      summary: Repositories the GitHub App can access (installation tokens)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Repositories
  /settings/integrations/gitlab/connect:
    post:
      tags: [Settings]
      summary: Create the GitLab OAuth application from an api-scoped token (admin, MFA step-up)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                baseUrl: { type: string, example: 'https://gitlab.com' }
                token: { type: string }
                groupPath: { type: string }
                keepToken: { type: boolean, default: false }
      responses:
        '200':
          description: Connected
        '422':
          description: Group applications cannot be created through this GitLab's API; manual entry required
  /settings/integrations/{provider}/check:
    post:
      tags: [Settings]
      summary: Health check of the connected GitHub App or GitLab application (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [github, gitlab] }
      responses:
        '200':
          description: ok / error
  /settings/integrations/{provider}/app:
    delete:
      tags: [Settings]
      summary: Remove the stored App/application credentials (admin, MFA step-up)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: provider
          required: true
          schema: { type: string, enum: [github, gitlab] }
      responses:
        '200':
          description: Removed
  /settings/rotate-secrets:
    post:
      tags: [Settings]
      summary: Rotate live admin/Postgres/Redis/webhook/Argo CD secrets with write-ahead self-recovery
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: string
                  example: ROTATE
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: New values (shown once), per-credential results and the operationId of the step log
        '401':
          $ref: '#/components/responses/StepUpRequired'
        '409':
          description: Another rotation is in progress (operationId of the holder), or the same Idempotency-Key is still running
        '422':
          description: Idempotency-Key reused with a different body
  /agent-tokens/me:
    get:
      tags: [AgentTokens]
      summary: Current agent token or human identity
      security:
        - bearerAuth: []
        - agentTokenAuth: []
      responses:
        '200':
          description: Identity
  /agent-tokens:
    get:
      tags: [AgentTokens]
      summary: List agent tokens
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token list
    post:
      tags: [AgentTokens]
      summary: Create agent token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
                expiresAt:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        '201':
          description: Created (includes raw token once)
        '401':
          $ref: '#/components/responses/StepUpRequired'
  /agent-tokens/{id}:
    get:
      tags: [AgentTokens]
      summary: Get agent token
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Token
    patch:
      tags: [AgentTokens]
      summary: Update agent token
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Updated
    delete:
      tags: [AgentTokens]
      summary: Revoke agent token
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Revoked
  /agent/commands/validate:
    post:
      tags: [AgentCommands]
      summary: Validate a command against policy
      security:
        - bearerAuth: []
        - agentTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command:
                  type: string
      responses:
        '200':
          description: Validation result (may include approvalId for destructive commands)
  /agent/commands/execute:
    post:
      tags: [AgentCommands]
      summary: Execute an allowlisted command
      security:
        - bearerAuth: []
        - agentTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command:
                  type: string
                confirm:
                  type: boolean
                reason:
                  type: string
                approvalId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Execution result
        '403':
          description: Denied or missing human approval
  /agent/commands/pending:
    get:
      tags: [AgentCommands]
      summary: List pending approvals (human JWT only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending approvals
        '403':
          description: Agent tokens are rejected
  /agent/commands/{id}/approve:
    post:
      tags: [AgentCommands]
      summary: Approve a pending command (human JWT only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Approved
  /agent/commands/{id}/reject:
    post:
      tags: [AgentCommands]
      summary: Reject a pending command (human JWT only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Rejected
  /projects:
    get:
      tags: [Projects]
      summary: List projects
      security:
        - bearerAuth: []
        - agentTokenAuth: []
      responses:
        '200':
          description: Projects
  /projects/{projectId}/environments/{envId}/topology:
    get:
      tags: [Projects]
      summary: Live read-only resource graph for one environment (Argo Application resources + namespace objects)
      description: |
        Nodes {id, kind, name, health, sync, info, events} and edges {from, to, type: owns|routes|selects}.
        Scoped to the environment namespace. Secret/ConfigMap nodes carry names only.
      security:
        - bearerAuth: []
        - agentTokenAuth: []
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: envId, in: path, required: true, description: Environment UUID (or environment name), schema: { type: string } }
      responses:
        '200':
          description: Graph (argo.found=false when the Application does not exist; warnings lists partial read failures)
        '403':
          description: No access to this project
        '404':
          description: Project or environment not found
        '503':
          description: Kubernetes unreachable
  /deploy:
    post:
      tags: [Deployments]
      summary: Start a deploy (one per project environment at a time); progress via GET /operations/{operationId}
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId]
              properties:
                projectId: { type: string, format: uuid }
                environmentId: { type: string, format: uuid }
                version: { type: string }
                branch: { type: string }
                commitSha: { type: string }
      responses:
        '201':
          description: Deployment created (includes operationId)
        '409':
          description: Another deploy/rollback/restart/terminate holds lock:project:<id>:deploy:<env> (operationId of the holder)
        '422':
          description: Idempotency-Key reused with a different body
  /operations/{id}:
    get:
      tags: [Operations]
      summary: Progress of a multi-step operation (deploy, secret rotation, DB provisioning)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Status, current step, per-step status/attempts/errors and a non-secret summary
        '404':
          description: Not found (or not visible to the caller)
  /operations:
    get:
      tags: [Operations]
      summary: Recent operations (projectId required unless admin/devops)
      security:
        - bearerAuth: []
      parameters:
        - { name: projectId, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { type: string, example: platform.secret-rotation } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        '200':
          description: Operations, newest first
components:
  responses:
    StepUpRequired:
      description: |
        No second factor within MFA_STEP_UP_MAX_AGE_SEC (default 900 s): `{ error: 'step_up_required', maxAgeSec }`.
        Call POST /auth/mfa/step-up and retry with the returned token. Agent tokens are not subject to step-up.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: step_up_required }
              maxAgeSec: { type: integer, example: 900 }
  schemas:
    MfaCode:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: 6-digit TOTP code, or a recovery code where accepted
    LoginSession:
      type: object
      properties:
        token:
          type: string
          description: Session JWT (claims id, email, name, role, amr, auth_time; mfa_enroll on enrolment-only sessions)
        user:
          type: object
        mfaEnrollmentRequired:
          type: boolean
    MfaChallengeRequired:
      type: object
      properties:
        mfa_required: { type: boolean, example: true }
        status: { type: string, example: mfa_required }
        challengeToken: { type: string, description: 'Short-lived (5 min); not a session' }
        expiresIn: { type: integer, example: 300 }
        methods: { type: array, items: { type: string }, example: [totp, recovery_code] }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Retries with the same key (same user, route and body) replay the stored response for 24 h without re-executing.
      schema:
        type: string
        maxLength: 255
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Human session JWT from POST /auth/login (or /auth/mfa/challenge when MFA is enabled)
    agentTokenAuth:
      type: http
      scheme: bearer
      description: Agent token (plat_agent_*)
