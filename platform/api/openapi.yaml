openapi: 3.0.3
info:
  title: Platform PaaS API
  version: 1.0.0
  description: |
    Internal Platform API including AI-first MCP agent tokens and guarded command execution.
servers:
  - url: /api
    description: Platform API base
tags:
  - name: Health
  - name: Auth
  - name: AgentTokens
  - name: AgentCommands
  - name: Projects
  - name: Settings
  - name: Notifications
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /openapi.json:
    get:
      tags: [Health]
      summary: OpenAPI document
      security: []
      responses:
        '200':
          description: OpenAPI 3 document
  /auth/login:
    post:
      tags: [Auth]
      summary: Password login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                email:
                  type: string
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: JWT issued
        '401':
          description: Invalid credentials
  /auth/providers:
    get:
      tags: [Auth]
      summary: Public GitHub/GitLab login availability
      security: []
      responses:
        '200':
          description: Provider flags
  /auth/github:
    get:
      tags: [Auth]
      summary: Start GitHub OAuth login
      security: []
      responses:
        '302':
          description: Redirect to GitHub
  /auth/gitlab:
    get:
      tags: [Auth]
      summary: Start GitLab OAuth login
      security: []
      responses:
        '302':
          description: Redirect to GitLab
  /users/me:
    get:
      tags: [Auth]
      summary: Current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile
    patch:
      tags: [Auth]
      summary: Update name and avatar
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Updated profile
  /notifications:
    get:
      tags: [Notifications]
      summary: List current user notifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Inbox
  /settings/integrations:
    get:
      tags: [Settings]
      summary: GitHub/GitLab OAuth apps and linking tokens
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Masked integration settings
    put:
      tags: [Settings]
      summary: Save GitHub/GitLab login and linking credentials
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Saved
  /settings/rotate-secrets:
    post:
      tags: [Settings]
      summary: Rotate live admin/Postgres/Redis/webhook/Argo CD secrets with write-ahead self-recovery
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: string
                  example: ROTATE
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: New values (shown once), per-credential results and the operationId of the step log
        '409':
          description: Another rotation is in progress (operationId of the holder), or the same Idempotency-Key is still running
        '422':
          description: Idempotency-Key reused with a different body
  /agent-tokens/me:
    get:
      tags: [AgentTokens]
      summary: Current agent token or human identity
      security:
        - bearerAuth: []
        - agentTokenAuth: []
      responses:
        '200':
          description: Identity
  /agent-tokens:
    get:
      tags: [AgentTokens]
      summary: List agent tokens
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token list
    post:
      tags: [AgentTokens]
      summary: Create agent token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string
                expiresAt:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        '201':
          description: Created (includes raw token once)
  /agent-tokens/{id}:
    get:
      tags: [AgentTokens]
      summary: Get agent token
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Token
    patch:
      tags: [AgentTokens]
      summary: Update agent token
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Updated
    delete:
      tags: [AgentTokens]
      summary: Revoke agent token
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Revoked
  /agent/commands/validate:
    post:
      tags: [AgentCommands]
      summary: Validate a command against policy
      security:
        - bearerAuth: []
        - agentTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command:
                  type: string
      responses:
        '200':
          description: Validation result (may include approvalId for destructive commands)
  /agent/commands/execute:
    post:
      tags: [AgentCommands]
      summary: Execute an allowlisted command
      security:
        - bearerAuth: []
        - agentTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command:
                  type: string
                confirm:
                  type: boolean
                reason:
                  type: string
                approvalId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Execution result
        '403':
          description: Denied or missing human approval
  /agent/commands/pending:
    get:
      tags: [AgentCommands]
      summary: List pending approvals (human JWT only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending approvals
        '403':
          description: Agent tokens are rejected
  /agent/commands/{id}/approve:
    post:
      tags: [AgentCommands]
      summary: Approve a pending command (human JWT only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Approved
  /agent/commands/{id}/reject:
    post:
      tags: [AgentCommands]
      summary: Reject a pending command (human JWT only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Rejected
  /projects:
    get:
      tags: [Projects]
      summary: List projects
      security:
        - bearerAuth: []
        - agentTokenAuth: []
      responses:
        '200':
          description: Projects
  /deploy:
    post:
      tags: [Deployments]
      summary: Start a deploy (one per project environment at a time); progress via GET /operations/{operationId}
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId]
              properties:
                projectId: { type: string, format: uuid }
                environmentId: { type: string, format: uuid }
                version: { type: string }
                branch: { type: string }
                commitSha: { type: string }
      responses:
        '201':
          description: Deployment created (includes operationId)
        '409':
          description: Another deploy/rollback/restart/terminate holds lock:project:<id>:deploy:<env> (operationId of the holder)
        '422':
          description: Idempotency-Key reused with a different body
  /operations/{id}:
    get:
      tags: [Operations]
      summary: Progress of a multi-step operation (deploy, secret rotation, DB provisioning)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Status, current step, per-step status/attempts/errors and a non-secret summary
        '404':
          description: Not found (or not visible to the caller)
  /operations:
    get:
      tags: [Operations]
      summary: Recent operations (projectId required unless admin/devops)
      security:
        - bearerAuth: []
      parameters:
        - { name: projectId, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { type: string, example: platform.secret-rotation } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        '200':
          description: Operations, newest first
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Retries with the same key (same user, route and body) replay the stored response for 24 h without re-executing.
      schema:
        type: string
        maxLength: 255
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Human JWT from POST /auth/login
    agentTokenAuth:
      type: http
      scheme: bearer
      description: Agent token (plat_agent_*)
