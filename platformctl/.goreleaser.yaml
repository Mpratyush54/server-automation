project_name: platformctl
before:
  hooks:
    - go mod tidy
builds:
  - main: .
    binary: platformctl
    id: platformctl
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    goarm:
      - "6"
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}} -X github.com/Mpratyush54/SERVER-automation/platformctl/cmd.Version={{.Version}} -X github.com/Mpratyush54/SERVER-automation/platformctl/internal/config.DefaultImageTag={{.Version}}
archives:
  - formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - none*
checksum:
  name_template: "checksums.txt"
snapshot:
  name_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
release:
  github:
    owner: Mpratyush54
    name: SERVER-automation
  extra_files:
    - glob: ../scripts/install.sh
      name_template: install.sh
  header: |
    ## platformctl {{ .Version }}

    Platform server bootstrap and management tool.

    Images for this release: `ghcr.io/mpratyush54/platform-api:{{ .Version }}` and `ghcr.io/mpratyush54/platform-portal:{{ .Version }}`.

    ### Installation

    ```bash
    curl -fsSL https://github.com/Mpratyush54/SERVER-automation/releases/download/{{ .Tag }}/install.sh | sh
    sudo platformctl provision
    ```
