version: 2
project_name: platformctl
before:
  hooks:
    - go mod tidy
builds:
  - main: .
    binary: platformctl
    id: platformctl
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    goarm:
      - "6"
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}} -X github.com/Mpratyush54/SERVER-automation/platformctl/cmd.Version={{.Version}} -X github.com/Mpratyush54/SERVER-automation/platformctl/internal/config.DefaultImageTag={{.Version}}
archives:
  - formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - none*
checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ .Tag }}-next"
changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
  groups:
    - title: Features
      regexp: '^.*?feat(\([^)]*\))?:.*$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([^)]*\))?:.*$'
      order: 1
    - title: Maintenance
      regexp: '^.*?(chore|refactor|perf)(\([^)]*\))?:.*$'
      order: 2
    - title: Documentation
      regexp: '^.*?docs(\([^)]*\))?:.*$'
      order: 3
    - title: Other Changes
      order: 999
  # Per-commit line only — GroupLabel is invalid in goreleaser v2 `format`
  format: "- {{.Subject}} (@{{.AuthorUsername}})"
release:
  github:
    owner: Mpratyush54
    name: SERVER-automation
  extra_files:
    - glob: ./install.sh
  header: |
    ## platformctl {{ .Version }}

    Platform server bootstrap and management tool.

    ### 📦 Downloads

    | OS / Arch | Link |
    |-----------|------|
    | Linux amd64 | [platformctl_{{ .Version }}_linux_amd64.tar.gz]({{ .ReleaseURL }}/download/{{ .Tag }}/platformctl_{{ .Version }}_linux_amd64.tar.gz) |
    | Linux arm64 | [platformctl_{{ .Version }}_linux_arm64.tar.gz]({{ .ReleaseURL }}/download/{{ .Tag }}/platformctl_{{ .Version }}_linux_arm64.tar.gz) |
    | macOS amd64 | [platformctl_{{ .Version }}_darwin_amd64.tar.gz]({{ .ReleaseURL }}/download/{{ .Tag }}/platformctl_{{ .Version }}_darwin_amd64.tar.gz) |
    | macOS arm64 | [platformctl_{{ .Version }}_darwin_arm64.tar.gz]({{ .ReleaseURL }}/download/{{ .Tag }}/platformctl_{{ .Version }}_darwin_arm64.tar.gz) |
    | Windows amd64 | [platformctl_{{ .Version }}_windows_amd64.zip]({{ .ReleaseURL }}/download/{{ .Tag }}/platformctl_{{ .Version }}_windows_amd64.zip) |
    | Windows arm64 | [platformctl_{{ .Version }}_windows_arm64.zip]({{ .ReleaseURL }}/download/{{ .Tag }}/platformctl_{{ .Version }}_windows_arm64.zip) |
    | Checksums | [checksums.txt]({{ .ReleaseURL }}/download/{{ .Tag }}/checksums.txt) |
    | Install script | [install.sh]({{ .ReleaseURL }}/download/{{ .Tag }}/install.sh) |

    ### 🐳 Container Images

    - `ghcr.io/mpratyush54/platform-api:{{ .Version }}`
    - `ghcr.io/mpratyush54/platform-portal:{{ .Version }}`

    ### 🚀 Quick Install

    ```bash
    curl -fsSL https://github.com/Mpratyush54/SERVER-automation/releases/download/{{ .Tag }}/install.sh | sh
    sudo platformctl provision
    ```

    ### 📋 Changelog
