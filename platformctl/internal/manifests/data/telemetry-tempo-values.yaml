fullnameOverride: tempo
replicas: 1
tempo:
  memBallastSizeMbs: 0
  reportingEnabled: false
  resources:
    requests: {cpu: 100m, memory: 192Mi}
    limits: {cpu: "1", memory: 512Mi}
  extraArgs: {config.expand-env: "true"}
  extraEnvFrom: [{secretRef: {name: telemetry-tempo-s3}}]
  retention: RETENTION_HOURS
  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://kube-prometheus-kube-prome-prometheus.monitoring.svc:9090/api/v1/write
  overrides:
    defaults:
      metrics_generator:
        processors: [service-graphs, span-metrics]
  storage:
    trace:
      backend: s3
      s3:
        bucket: tempo
        endpoint: minio.storage.svc.cluster.local:9000
        access_key: ${S3_ACCESS_KEY}
        secret_key: ${S3_SECRET_KEY}
        insecure: true
      wal: {path: /var/tempo/wal}
  receivers:
    jaeger: null
    opencensus: null
    otlp:
      protocols:
        grpc: {endpoint: "0.0.0.0:4317"}
        http: {endpoint: "0.0.0.0:4318"}
persistence: {enabled: true, size: 5Gi}
serviceMonitor:
  enabled: true
  additionalLabels: {release: kube-prometheus}
# Explicit config keeps generated RED and graph metrics project scoped too.
config: |
  multitenancy_enabled: false
  usage_report: {reporting_enabled: false}
  server: {http_listen_port: 3200}
  distributor:
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: "0.0.0.0:4317"}
          http: {endpoint: "0.0.0.0:4318"}
  ingester:
    max_block_duration: 5m
    max_block_bytes: 10485760
  compactor:
    compaction:
      block_retention: RETENTION_HOURS
  storage:
    trace:
      backend: s3
      s3:
        bucket: tempo
        endpoint: minio.storage.svc.cluster.local:9000
        access_key: ${S3_ACCESS_KEY}
        secret_key: ${S3_SECRET_KEY}
        insecure: true
      wal: {path: /var/tempo/wal}
  metrics_generator:
    registry:
      external_labels: {source: tempo}
    processor:
      service_graphs:
        dimensions: [platform.project_id, deployment.environment]
      span_metrics:
        dimensions: [platform.project_id, deployment.environment]
    storage:
      path: /var/tempo/generator
      remote_write:
        - url: http://kube-prometheus-kube-prome-prometheus.monitoring.svc:9090/api/v1/write
          send_exemplars: true
  overrides:
    defaults:
      metrics_generator:
        processors: [service-graphs, span-metrics]
        max_active_series: 10000
