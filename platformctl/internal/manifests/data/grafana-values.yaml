grafana:
  enabled: true
  grafana.ini:
    server:
      root_url: https://{{DOMAIN}}/grafana/
      serve_from_sub_path: true
      domain: "{{DOMAIN}}"
    security:
      allow_embedding: true
      cookie_samesite: none
      cookie_secure: true
    auth.generic_oauth:
      enabled: true
      name: Platform
      allow_sign_up: true
      client_id: grafana
      client_secret: "{{OIDC_SECRET_GRAFANA}}"
      scopes: openid profile email groups
      auth_url: https://{{DOMAIN}}/api/oauth/authorize
      # Server-to-server calls go in-cluster so SSO works before/without a public cert.
      token_url: {{OIDC_INTERNAL}}/token
      api_url: {{OIDC_INTERNAL}}/userinfo
      role_attribute_path: "contains(groups[*], 'Admin') && 'Admin' || contains(groups[*], 'DevOps') && 'Admin' || contains(groups[*], 'Tech Lead') && 'Editor' || 'Viewer'"
  ingress:
    enabled: false
prometheus-node-exporter:
  # Chart defaults, plus the textfile collector that publishes
  # `platformctl backup` metrics (written to /var/lib/platform/metrics on the
  # host; the chart mounts the host root at /host/root).
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$
    - --collector.textfile.directory=/host/root/var/lib/platform/metrics
