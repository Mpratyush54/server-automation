ingress:
  enabled: false
extraEnvVars:
  - name: MINIO_BROWSER_REDIRECT_URL
    value: https://minio.{{DOMAIN}}
  - name: MINIO_IDENTITY_OPENID_ENABLE
    value: "on"
  - name: MINIO_IDENTITY_OPENID_CONFIG_URL
    value: http://platform-api.platform.svc.cluster.local:3000/api/oauth/.well-known/openid-configuration
  - name: MINIO_IDENTITY_OPENID_CLIENT_ID
    value: minio
  - name: MINIO_IDENTITY_OPENID_CLIENT_SECRET
    value: "{{OIDC_SECRET_MINIO}}"
  - name: MINIO_IDENTITY_OPENID_DISPLAY_NAME
    value: Platform
  # The OpenID discovery document names the public issuer, so MinIO fetches
  # the signing keys over https://{{DOMAIN}}. Trust the platform's internal CA
  # (used when Let's Encrypt cannot issue) next to the system roots; platformctl
  # publishes its certificate in the optional platform-ca ConfigMap.
  - name: SSL_CERT_DIR
    value: /etc/ssl/certs:/etc/platform-ca
extraVolumes:
  - name: platform-ca
    configMap:
      name: platform-ca
      optional: true
extraVolumeMounts:
  - name: platform-ca
    mountPath: /etc/platform-ca
    readOnly: true

console:
  extraEnvVars:
    - name: MINIO_IDENTITY_OPENID_ENABLE
      value: "on"
    - name: MINIO_IDENTITY_OPENID_CONFIG_URL
      value: http://platform-api.platform.svc.cluster.local:3000/api/oauth/.well-known/openid-configuration
    - name: MINIO_IDENTITY_OPENID_CLIENT_ID
      value: minio
    - name: MINIO_IDENTITY_OPENID_CLIENT_SECRET
      value: "{{OIDC_SECRET_MINIO}}"
    - name: MINIO_IDENTITY_OPENID_DISPLAY_NAME
      value: Platform
    - name: MINIO_IDENTITY_OPENID_REDIRECT_URI
      value: https://minio.{{DOMAIN}}/oauth_callback
    - name: SSL_CERT_DIR
      value: /etc/ssl/certs:/etc/platform-ca
  extraVolumes:
    - name: platform-ca
      configMap:
        name: platform-ca
        optional: true
  extraVolumeMounts:
    - name: platform-ca
      mountPath: /etc/platform-ca
      readOnly: true
