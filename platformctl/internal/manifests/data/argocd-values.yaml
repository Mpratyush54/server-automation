configs:
  cm:
    url: "https://{{DOMAIN}}/argocd"
    # Portal iframes always use /argocd/ — keep path-based on every install.
    server.basehref: "/argocd"
    server.rootpath: "/argocd"
    oidc.config: |
      name: Platform
      issuer: https://{{DOMAIN}}/api/oauth
      clientID: argocd
      clientSecret: argocd-secret-placeholder
      requestedScopes: ["openid", "profile", "email", "groups"]
  params:
    server.insecure: "true"
    server.rootpath: "/argocd"
    server.basehref: "/argocd"
  rbac:
    policy.csv: |
      g, Admin, role:admin
      g, DevOps, role:admin
      g, Tech Lead, role:readonly
      g, Developer, role:readonly
server:
  insecure: true
  extraArgs:
    - --rootpath=/argocd
    - --basehref=/argocd
    - --insecure
  ingress:
    enabled: false
