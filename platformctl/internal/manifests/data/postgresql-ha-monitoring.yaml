apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgresql
  namespace: monitoring
  labels:
    release: kube-prometheus
spec:
  namespaceSelector:
    matchNames: [databases]
  selector:
    matchLabels:
      cnpg.io/cluster: postgresql
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      interval: 60s
      scrapeTimeout: 10s
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: cnpg_collector_up
          targetLabel: __name__
          replacement: pg_up
          action: replace
        - sourceLabels: [__name__]
          regex: cnpg_project_database_(.+)
          targetLabel: __name__
          replacement: project_database_$1
          action: replace
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: postgresql-ha
  namespace: monitoring
  labels:
    release: kube-prometheus
spec:
  groups:
    - name: postgresql.ha
      rules:
        - alert: PostgresHAInstanceDown
          expr: pg_up{namespace="databases"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: PostgreSQL instance is unavailable
        - alert: PostgresHANoPrimary
          expr: (count(cnpg_pg_replication_in_recovery{namespace="databases"} == 0) or vector(0)) < 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: PostgreSQL has no primary
        - alert: PostgresHAReplicationLag
          expr: cnpg_pg_replication_lag{namespace="databases"} > 60
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: PostgreSQL replication lag exceeds sixty seconds
        - alert: PostgresHAWALArchivingFailing
          expr: increase(cnpg_pg_stat_archiver_failed_count{namespace="databases"}[15m]) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: PostgreSQL WAL archiving is failing
        # CNPG's collector emits this timestamp when an available backup exists.
        - alert: PostgresHABackupTooOld
          expr: time() - cnpg_collector_last_available_backup_timestamp{namespace="databases"} > 2*86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: PostgreSQL last available backup is over two days old
