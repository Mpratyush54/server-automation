# Applied after Prometheus CRDs exist. No query text is exported as labels.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: platform-databases
  namespace: monitoring
  labels:
    release: kube-prometheus
spec:
  namespaceSelector:
    matchNames: [databases]
  selector:
    matchExpressions:
      - key: app.kubernetes.io/instance
        operator: In
        values: [postgresql, mongodb, redis]
      - key: app.kubernetes.io/name
        operator: In
        values: [postgresql, mongodb, redis]
  endpoints:
    - port: http-metrics
      interval: 60s
      scrapeTimeout: 10s
