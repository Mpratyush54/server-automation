apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-platform-images
  annotations:
    policies.kyverno.io/title: Verify platform image signatures
spec:
  validationFailureAction: Enforce
  background: true
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-platform-ghcr
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - platform
      verifyImages:
        - imageReferences:
            - "ghcr.io/mpratyush54/*"
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: "https://github.com/Mpratyush54/server-automation/.github/workflows/*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
          mutateDigest: true
          verifyDigest: true
          required: true
