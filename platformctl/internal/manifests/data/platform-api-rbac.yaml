# Admission guards for the platform API's namespace-baseline rights (#22).
# ValidatingAdmissionPolicy is GA since Kubernetes 1.30 and runs in the API
# server: no webhook pod, controller or extra CNI. RBAC cannot filter by
# namespace label, so these policies confine the API's cluster-scoped
# namespace/rolebinding verbs to dedicated, labeled project namespaces.
# The reserved list mirrors reservedNamespaces in platform/api/src/lib/namespace-baseline.ts.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: platform-baseline-bindings
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: ["rbac.authorization.k8s.io"]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["rolebindings"]
  matchConditions:
  - name: platform-api-only
    expression: "request.userInfo.username == 'system:serviceaccount:platform:platform-api'"
  validations:
  - expression: "namespaceObject != null && has(namespaceObject.metadata.labels) && 'platform.io/project' in namespaceObject.metadata.labels && 'platform.io/env' in namespaceObject.metadata.labels && !(namespaceObject.metadata.name in ['default', 'platform', 'databases', 'preview', 'ingress-nginx', 'argocd', 'cert-manager', 'monitoring', 'oauth2-proxy', 'portainer', 'storage', 'keda', 'builds', 'registry']) && !namespaceObject.metadata.name.startsWith('kube-')"
    message: "Baseline bindings require a dedicated project namespace"
  - expression: "object.metadata.name == 'platform-namespace-baseline' && object.roleRef.apiGroup == 'rbac.authorization.k8s.io' && object.roleRef.kind == 'ClusterRole' && object.roleRef.name == 'platform-namespace-baseline' && has(object.subjects) && size(object.subjects) == 1 && object.subjects[0].kind == 'ServiceAccount' && object.subjects[0].name == 'platform-api' && object.subjects[0].namespace == 'platform'"
    message: "Only the platform baseline binding may be bootstrapped"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: platform-baseline-bindings
spec:
  policyName: platform-baseline-bindings
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: platform-project-namespaces
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["namespaces"]
  matchConditions:
  - name: platform-api-only
    expression: "request.userInfo.username == 'system:serviceaccount:platform:platform-api'"
  validations:
  - expression: "!(object.metadata.name in ['default', 'platform', 'databases', 'preview', 'ingress-nginx', 'argocd', 'cert-manager', 'monitoring', 'oauth2-proxy', 'portainer', 'storage', 'keda', 'builds', 'registry']) && !object.metadata.name.startsWith('kube-')"
    message: "The platform API may only manage dedicated project namespaces"
  - expression: "has(object.metadata.labels) && 'platform.io/project' in object.metadata.labels && 'platform.io/env' in object.metadata.labels"
    message: "Project namespaces must carry platform.io/project and platform.io/env labels"
  - expression: "request.operation != 'UPDATE' || !has(oldObject.metadata.labels) || !('platform.io/project' in oldObject.metadata.labels) || (has(object.metadata.labels) && 'platform.io/project' in object.metadata.labels && object.metadata.labels['platform.io/project'] == oldObject.metadata.labels['platform.io/project'])"
    message: "Project namespace ownership cannot be reassigned"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: platform-project-namespaces
spec:
  policyName: platform-project-namespaces
  validationActions: [Deny]
---
# Source builds (#55): RBAC cannot restrict the name of a created object, so
# the baseline "secrets: create" grant is confined here to the single image-pull
# Secret the API writes in project namespaces (pull-only, per project).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: platform-project-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
      - {key: platform.io/project, operator: Exists}
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["secrets"]
  matchConditions:
  - name: platform-api-only
    expression: "request.userInfo.username == 'system:serviceaccount:platform:platform-api'"
  validations:
  - expression: "object.metadata.name == 'source-registry' && has(object.type) && object.type == 'kubernetes.io/dockerconfigjson'"
    message: "The platform API may only write the source-registry image-pull Secret in project namespaces"
  - expression: "has(object.data) && size(object.data) == 1 && '.dockerconfigjson' in object.data"
    message: "The source-registry Secret may only carry .dockerconfigjson"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: platform-project-secrets
spec:
  policyName: platform-project-secrets
  validationActions: [Deny]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-api
  namespace: platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-api
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "create", "update"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list", "delete"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["list", "create", "update", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["create", "update", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "create", "update"]
# Namespace baseline (#22): get/update label project namespaces (guarded by
# platform-project-namespaces); rolebinding create/update + bind on the single
# baseline ClusterRole bootstrap per-namespace rights (guarded by
# platform-baseline-bindings). No delete/patch/escalate and no cluster-wide bindings.
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["rolebindings"]
  verbs: ["get", "create", "update"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterroles"]
  resourceNames: ["platform-namespace-baseline"]
  verbs: ["bind"]
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  resourceNames: ["scaledobjects.keda.sh", "httpscaledobjects.http.keda.sh"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-api
subjects:
- kind: ServiceAccount
  name: platform-api
  namespace: platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-api
  namespace: platform
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["platform-backup-backup", "platform-backup-restore-test", "platform-backup-target"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["platform-env","platform-rotate-pending"]
  verbs: ["get", "update"]
# The API's own configuration Secrets (issue #20): read at boot, updated on
# secret rotation and OIDC signing-key rotation (KubeSecretStore does
# read + replace with resourceVersion, so no patch). Creation (first boot
# without the installer) uses the namespace-wide create rule below.
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["platform-credentials","platform-oidc-signing-key"]
  verbs: ["get", "update"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["platform-rotate-pending"]
  verbs: ["delete"]
# Source builds (#55): the registry token signing key, read-only.
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["registry-token-signer"]
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["platform-api"]
  verbs: ["patch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
# Leader election (exactly-once background jobs). create cannot be limited by
# resourceName; get/update are limited to the one Lease, in this namespace only.
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["create"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  resourceNames: ["platform-api-leader"]
  verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-api
  namespace: platform
subjects:
- kind: ServiceAccount
  name: platform-api
  namespace: platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-api
  namespace: databases
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["postgresql","redis"]
  verbs: ["get", "update"]
# Backup visibility (#186): read-only, the one Cluster and ObjectStore.
- apiGroups: ["postgresql.cnpg.io"]
  resources: ["clusters"]
  resourceNames: ["postgresql"]
  verbs: ["get"]
- apiGroups: ["barmancloud.cnpg.io"]
  resources: ["objectstores"]
  resourceNames: ["postgresql-backup"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-api
  namespace: databases
subjects:
- kind: ServiceAccount
  name: platform-api
  namespace: platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-api
  namespace: argocd
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["argocd-secret","argocd-initial-admin-secret"]
  verbs: ["get", "update"]
- apiGroups: ["argoproj.io"]
  resources: ["applications"]
  verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-api
  namespace: argocd
subjects:
- kind: ServiceAccount
  name: platform-api
  namespace: platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-api
---
# Deliberately has no ClusterRoleBinding: granted per project namespace only,
# via the RoleBinding the API bootstraps there. Verbs are exactly what
# ensureProjectNamespace (read/create/replace) and status/backfill (list) use.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-namespace-baseline
rules:
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "create", "update"]
- apiGroups: [""]
  resources: ["resourcequotas", "limitranges"]
  verbs: ["get", "list", "create", "update"]
# Live topology graph (#31): read-only list in project namespaces only (this
# ClusterRole is bound per project namespace). No secrets/configmaps: Secret and
# ConfigMap nodes are derived by name from the objects that reference them.
- apiGroups: [""]
  resources: ["pods", "services", "persistentvolumeclaims", "events"]
  verbs: ["list"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["list"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["list"]
- apiGroups: ["cert-manager.io"]
  resources: ["certificates"]
  verbs: ["list"]

- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "create", "update", "delete"]
- apiGroups: ["keda.sh"]
  resources: ["scaledobjects"]
  verbs: ["get", "list", "create", "update", "delete"]
- apiGroups: ["http.keda.sh"]
  resources: ["httpscaledobjects"]
  verbs: ["get", "create", "update", "delete"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "create", "update", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["update"]
- apiGroups: ["apps"]
  resources: ["deployments/scale"]
  verbs: ["patch"]
# Source builds (#55): workload reads and a managed image-pull Secret, scoped
# by the per-project namespace binding above. No secret list or delete rights.
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get"]
# Release finalize (injectRelease): projects may ship StatefulSets via Argo CD;
# read, list and replace them in project namespaces only. No create, delete or patch.
- apiGroups: ["apps"]
  resources: ["statefulsets"]
  verbs: ["get", "list", "update"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["source-registry"]
  verbs: ["get", "update"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
