# Applied after monitoring CRDs exist; selected by kube-prometheus (same
# pattern as database-monitoring.yaml: lives in monitoring, scrapes another ns).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: longhorn
  namespace: monitoring
  labels:
    release: kube-prometheus
spec:
  namespaceSelector:
    matchNames: [longhorn-system]
  selector:
    matchLabels:
      app: longhorn-manager
  endpoints:
    - port: manager
      interval: 60s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: longhorn
  namespace: monitoring
  labels:
    release: kube-prometheus
spec:
  groups:
    - name: longhorn.storage
      rules:
        - alert: LonghornVolumeDegraded
          expr: longhorn_volume_robustness == 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume {{ $labels.volume }} is degraded"
            description: "Restore schedulable nodes and check replica rebuild progress."
        - alert: LonghornVolumeFaulted
          expr: longhorn_volume_robustness == 3
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn volume {{ $labels.volume }} is faulted"
            description: "Check replica health and restore from backup if recovery is unavailable."
        - alert: LonghornNodeNotReady
          expr: longhorn_node_status{condition="ready"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn node {{ $labels.node }} is not ready"
            description: "Check node connectivity, manager health and iSCSI prerequisites."
        - alert: LonghornDiskUsageHigh
          expr: longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes > 0.85
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn disk {{ $labels.disk }} usage exceeds 85%"
            description: "Add storage capacity or remove unused snapshots and volumes."
---
# Longhorn's chart NetworkPolicy only admits Longhorn components to the
# manager, so Prometheus scrapes were refused (3-node test). Policies are
# additive: this one admits only Prometheus, only on the metrics port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-metrics
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9500
