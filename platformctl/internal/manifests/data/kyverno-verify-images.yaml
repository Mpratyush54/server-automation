# ClusterPolicy: require cosign keyless signatures on platform images in the
# platform namespace. Mode is substituted by platformctl (Audit|Enforce).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-platform-images
  annotations:
    policies.kyverno.io/title: Verify platform image signatures
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Ensures ghcr.io/mpratyush54/* images admitted into the platform namespace
      were signed keyless by this repository's GitHub Actions workflows.
spec:
  validationFailureAction: {{VALIDATION_FAILURE_ACTION}}
  background: true
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-platform-ghcr
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - platform
      verifyImages:
        - imageReferences:
            - "ghcr.io/mpratyush54/*"
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: "https://github.com/Mpratyush54/server-automation/.github/workflows/*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
          mutateDigest: true
          verifyDigest: true
          required: true
