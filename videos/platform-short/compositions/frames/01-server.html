  <script>
    (function(){
      const el=(suffix)=>document.getElementById('f-01-server-'+suffix);
      const tl=gsap.timeline({paused:true});
      tl.addLabel('your-server',0);
      tl.addLabel('platform-online',3.1);
      tl.addLabel('connected-services',4.8);
      tl.addLabel('one-place',7.7);
      const arrivals=[['line-a',.04,80,.20],['line-b',.225,45,.16],['frag-a',.37,70,.16],['frag-b',.51,70,.15],['dot',.625,40,.12]];
      arrivals.forEach(([id,start,y,duration])=>{
        tl.set(el(id),{opacity:0},0);
        tl.set(el(id),{opacity:1,y:y},start);
        tl.fromTo(el(id),{y:y},{y:0,duration:duration,ease:'power4.out',immediateRender:false},start);
      });
      tl.fromTo(el('app'),{opacity:0,y:32},{opacity:1,y:0,duration:.55,ease:'power3.out'},1.12);
      ['path-a','path-b','path-c','path-d'].forEach((id)=>{const p=el(id);const len=p.getTotalLength();p.style.strokeDasharray=String(len);p.style.strokeDashoffset=String(len);});
      tl.to(el('path-a'),{strokeDashoffset:0,duration:.58,ease:'power2.out'},2.08);
      tl.fromTo(el('platform'),{scale:0,opacity:0},{scale:1,opacity:1,duration:.6,ease:'power3.out'},2.58);
      tl.fromTo(el('base'),{scaleY:0,opacity:0},{scaleY:1,opacity:1,duration:.5,ease:'power3.out'},3.42);
      tl.to(el('path-b'),{strokeDashoffset:0,duration:.52,ease:'power2.out'},4.12);
      tl.to(el('path-c'),{strokeDashoffset:0,duration:.55,ease:'power2.out'},4.85);
      tl.to(el('path-d'),{strokeDashoffset:0,duration:.4,ease:'power2.out'},5.65);
      tl.fromTo(el('mod-a'),{scale:.95,opacity:0,y:20},{scale:1,opacity:1,y:0,duration:.56,ease:'power3.out'},4.58);
      tl.fromTo(el('mod-b'),{scale:.95,opacity:0,y:20},{scale:1,opacity:1,y:0,duration:.56,ease:'power3.out'},5.39);
      tl.fromTo(el('mod-c'),{scale:.95,opacity:0,y:20},{scale:1,opacity:1,y:0,duration:.56,ease:'power3.out'},6.24);

      // Adapt the Tracing Beam registry's measured dash to this portrait's
      // existing routes. Every packet terminates on its real receiving card.
      function packet(name,at,duration){
        const path=el('packet-'+name);
        const length=path.getTotalLength();
        const dash=28;
        tl.set(path,{strokeDasharray:dash+' '+(length+dash),strokeDashoffset:dash,opacity:0},0);
        tl.set(path,{strokeDashoffset:dash,opacity:1},at);
        tl.to(path,{strokeDashoffset:-length,duration:duration,ease:'none'},at);
        tl.set(path,{opacity:0},at+duration);
      }
      [2.9,4.35,5.8,7.25].forEach((at)=>{
        packet('app',at,.5);
        tl.to(el('app-bar').querySelectorAll('i'),{backgroundColor:'#2c6a46',duration:.14,stagger:.07,ease:'none'},at+.48);
        tl.to(el('app-bar').querySelectorAll('i'),{backgroundColor:'#28251f',duration:.18,stagger:.07,ease:'none'},at+.95);
        tl.to(el('platform'),{borderColor:'#2c6a46',duration:.25,ease:'power1.out'},at+.5);
      });
      const services=[['deploy','mod-a',5.05,.65],['data','mod-b',5.82,.75],['metrics','mod-c',6.65,.85]];
      services.forEach(([route,card,at,duration])=>{
        packet(route,at,duration);
        tl.to(el(card),{y:-5,borderColor:'#c94d3c',duration:.2,ease:'power2.out'},at+duration-.1);
        tl.to(el(card),{y:0,duration:.35,ease:'power2.inOut'},at+duration+.1);
      });
      Array.from(el('app-panels').children).forEach((panel,i)=>{
        tl.fromTo(panel,{scaleY:0},{scaleY:1,duration:.35,transformOrigin:'center bottom',ease:'power2.out'},1.55+i*.18);
        tl.to(panel,{backgroundColor:'#d4e2d4',duration:.3,ease:'power1.out'},3.45+i*.18);
      });
      // A final completed request keeps the back of the shot active while
      // the three connected capabilities remain fully readable.
      packet('data',7.75,.8);
      tl.to(el('mod-b'),{backgroundColor:'#d4e2d4',duration:.3,ease:'power1.out'},8.3);
      tl.fromTo(el('camera'),{scale:1,y:0},{scale:1.016,y:-4,duration:8.6,ease:'none'},0);
      window.__timelines=window.__timelines||{};
      window.__timelines['01-server']=tl;
    })();
