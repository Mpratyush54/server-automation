  <script>
    (function(){
      var tl=gsap.timeline({paused:true});
      function own(name){return document.getElementById('f-01-own-'+name);}
      tl.addLabel('own-your-server',0);
      tl.addLabel('server-online',3.1);
      tl.addLabel('platform-connected',6.5);
      tl.addLabel('services-respond',8.6);
      tl.addLabel('ownership-lockup',13.6);
      var waterfall=[['your1',.08,78,.2],['server',.28,65,.19],['your2',.46,48,.15],['plat',.60,70,.16],['form',.74,70,.15],['dot',.86,42,.12]];
      waterfall.forEach(function(v){var el=own(v[0]);tl.set(el,{opacity:0},0);tl.set(el,{opacity:1,y:v[2]},v[1]);tl.to(el,{y:0,duration:v[3],ease:'power4.out'},v[1]);});
      tl.fromTo(own('app'),{scale:.86,opacity:0,y:28},{scale:1,opacity:1,y:0,duration:.7,ease:'power3.out'},.16);
      tl.fromTo(own('rack'),{scale:.94,opacity:0,y:24},{scale:1,opacity:1,y:0,duration:.65,ease:'power3.out'},1.75);
      tl.fromTo(own('ownership'),{opacity:0,y:12},{opacity:1,y:0,duration:.4,ease:'power3.out'},2.25);
      var draws=[['app-link',2.55,.55],['control-outline',3.62,.8],['rack-link',6.1,.42],['module-rail',6.5,.8]];
      draws.forEach(function(v){var p=own(v[0]);var len=p.getTotalLength();p.style.strokeDasharray=String(len);p.style.strokeDashoffset=String(len);tl.fromTo(p,{strokeDashoffset:len},{strokeDashoffset:0,duration:v[2],ease:'power2.out'},v[1]);});
      tl.fromTo(own('platform'),{scale:0,opacity:0},{scale:1,opacity:1,duration:.5,ease:'power3.out'},4.55);
      tl.fromTo(own('ubuntu'),{scale:0,opacity:0},{scale:1,opacity:1,duration:.6,ease:'power3.out'},5.05);
      tl.fromTo(own('k3s'),{scale:0,opacity:0},{scale:1,opacity:1,duration:.6,ease:'power3.out'},6.15);
      ['deploy','connect','observe'].forEach(function(name,i){tl.fromTo(own(name),{scale:.94,opacity:0,y:18},{scale:1,opacity:1,y:0,duration:.55,ease:'power3.out'},7.3+i*.65);});

      // Tracing Beam registry mechanism: a measured traveling dash on each
      // existing route, followed by a response from its destination. Routes
      // remain in place, so every request visibly arrives at a real service.
      function packet(name,at,duration){
        var path=own('packet-'+name);
        var length=path.getTotalLength();
        var dash=22;
        tl.set(path,{strokeDasharray:dash+' '+(length+dash),strokeDashoffset:dash,opacity:0},0);
        tl.set(path,{strokeDashoffset:dash,opacity:1},at);
        tl.to(path,{strokeDashoffset:-length,duration:duration,ease:'none'},at);
        tl.set(path,{opacity:0},at+duration);
      }
      [3.15,5.55,7.95,10.35,12.75].forEach(function(at){
        packet('app',at,.65);
        var lights=own('rack').querySelectorAll('b');
        tl.to(lights,{backgroundColor:'#2c6a46',duration:.14,stagger:.07,ease:'none'},at+.58);
        tl.to(lights,{backgroundColor:'#c94d3c',duration:.25,stagger:.07,ease:'none'},at+1.3);
      });
      ['deploy','connect','observe'].forEach(function(name,i){
        var at=8.6+i*1.25;
        packet(name,at,.9);
        tl.to(own(name),{backgroundColor:'#c94d3c',color:'#f6f3eb',y:-6,duration:.25,ease:'power2.out'},at+.82);
        tl.to(own(name),{backgroundColor:name==='deploy'?'#ECC2BC':'#f6f3eb',color:'#28251f',y:0,duration:.45,ease:'power2.inOut'},at+1.25);
        packet(name,12.45+i*.32,.95);
        tl.to(own(name),{borderColor:'#c94d3c',duration:.25,ease:'power1.out'},13.3+i*.32);
      });
      [1,2,3].forEach(function(i){
        tl.fromTo(own('app-line-'+i),{scaleX:0},{scaleX:1,duration:.45,ease:'power2.out'},1.0+i*.22);
        tl.to(own('app-line-'+i),{backgroundColor:'#2c6a46',duration:.3,ease:'power1.out'},4.1+i*.15);
      });
      tl.to(own('app').querySelector('[data-own="appbar"]'),{backgroundColor:'#d4e2d4',duration:.4,ease:'power1.out'},4.05);
      tl.to(own('emphasis'),{color:'#c94d3c',duration:.6,ease:'power1.out'},11.9);

      // One restrained, continuous push preserves the readable layout while
      // the successive app/server/service activity carries the explanation.
      tl.fromTo(own('camera'),{scale:1,x:0,y:0},{scale:1.015,x:-3,y:-2,duration:8,ease:'none'},0);
      tl.to(own('camera'),{scale:1.03,x:-8,y:-4,duration:6.5,ease:'sine.inOut'},8);
      window.__timelines=window.__timelines||{};window.__timelines['01-own']=tl;
    })();
  </script>
