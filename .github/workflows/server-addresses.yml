name: Server address hygiene
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test scripts/tests/server-addresses.test.mjs scripts/tests/sdk-config.test.mjs
      - run: node scripts/check-server-addresses.mjs
