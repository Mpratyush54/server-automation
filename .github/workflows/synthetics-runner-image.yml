name: Synthetics Runner Image

# Browser synthetic check runner (#42): headless Chromium on the Playwright base
# image. Built separately from docker-build.yml because it is large (~1.5 GiB) and
# only used on full-profile installs with SYNTHETICS_BROWSER=true. The vulnerability
# scan is reported (SARIF) but does not block: findings come from the upstream
# browser base image, which is bumped together with playwright-core.

on:
  push:
    branches: [ "master" ]
    tags: [ "v*.*.*" ]
    paths:
      - "platform/synthetics-runner/**"
      - ".github/workflows/synthetics-runner-image.yml"
  pull_request:
    branches: [ "master" ]
    paths:
      - "platform/synthetics-runner/**"
      - ".github/workflows/synthetics-runner-image.yml"
  workflow_dispatch:

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: mpratyush54
  IMAGE: platform-synthetics-runner

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit tests (no browser)
        working-directory: platform/synthetics-runner
        run: node --test runner.test.mjs

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build (PR, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: platform/synthetics-runner
          platforms: linux/amd64
          push: false
          tags: local/${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=${{ env.IMAGE }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}

      - name: Build and push
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: platform/synthetics-runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.IMAGE }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image (keyless)
        if: github.event_name != 'pull_request'
        env:
          DIGEST_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cosign sign --yes "$DIGEST_REF"
          echo "Signed \`$DIGEST_REF\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Scan (report only)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ env.IMAGE }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload scan results
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ env.IMAGE }}.sarif
          category: trivy-${{ env.IMAGE }}

  make-package-public:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Make the GHCR package public (pulled anonymously by the cluster)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh api --method PUT -H "Accept: application/vnd.github+json" \
            "/user/packages/container/${IMAGE}/visibility" -f visibility=public \
            || gh api --method PUT -H "Accept: application/vnd.github+json" \
              "/orgs/${OWNER}/packages/container/${IMAGE}/visibility" -f visibility=public \
            || echo "WARN: could not set ${IMAGE} public (may already be public or need a manual toggle)"
