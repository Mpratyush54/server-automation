name: publish platform stack

# Builds ghcr.io/mpratyush54/platform-stack:<YYYY.MM.DD-run>-<arch>: every
# third-party image, chart and k3s in one artifact (scripts/build-stack.sh).
# Versioned independently of platformctl. Servers install the `stable` channel
# by default (PLATFORM_STACK); a push to master publishes `edge`; run this
# workflow by hand to publish (and promote) `stable`.
on:
  push:
    branches: [master]
    paths:
      - platformctl/internal/versions/**
      - platformctl/internal/images/images.txt
      - platformctl/internal/manifests/data/*-values.yaml
      - scripts/build-stack.sh
      - scripts/build-bundle.sh
      - .github/workflows/publish-stack.yml
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel tag to move to the new stack (stable = what servers install)"
        default: stable
        type: choice
        options: [stable, edge]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish-stack
  cancel-in-progress: false

jobs:
  stack:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'edge' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: platformctl/go.mod
          cache-dependency-path: platformctl/go.sum

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # build-bundle.sh needs the classic image store: with the containerd
      # store, `docker save` of a --platform pull exports incomplete images.
      - name: Use Docker's classic image store
        run: |
          set -euo pipefail
          cfg=/etc/docker/daemon.json
          [ -s "$cfg" ] || echo '{}' | sudo tee "$cfg" >/dev/null
          sudo jq '.features = ((.features // {}) + {"containerd-snapshotter": false})' "$cfg" | sudo tee "$cfg.new" >/dev/null
          sudo mv "$cfg.new" "$cfg"
          sudo systemctl restart docker
          docker info --format '{{.Driver}} {{.DriverStatus}}'

      - name: Install helm, oras, zstd and jq (not from GitHub Releases)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd jq
          curl -fsSL --retry 5 https://get.helm.sh/helm-v3.22.1-linux-amd64.tar.gz | tar -xz -C /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          go install oras.land/oras/cmd/oras@v1.2.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the stack
        id: push_stack
        run: |
          version="$(date -u +%Y.%m.%d)-${{ github.run_number }}"
          echo "stack version $version, channel $CHANNEL"
          PUSH=1 bash scripts/build-stack.sh "$version" "${{ matrix.arch }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### platform-stack $version-${{ matrix.arch }} → $CHANNEL" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign platform-stack (keyless)
        env:
          VERSION: ${{ steps.push_stack.outputs.version }}
          ARCH: ${{ matrix.arch }}
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          ref="ghcr.io/mpratyush54/platform-stack:${VERSION}-${ARCH}"
          digest="$(oras resolve "$ref")"
          if [ -z "$digest" ]; then
            echo "::error::could not resolve digest for $ref"
            exit 1
          fi
          cosign sign --yes "ghcr.io/mpratyush54/platform-stack@${digest}"
          echo "- Signed \`${ref}\` (@${digest})" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify anonymous pull
        run: |
          oras logout ghcr.io || true
          oras manifest fetch "ghcr.io/mpratyush54/platform-stack:$CHANNEL-${{ matrix.arch }}" >/dev/null \
            || { echo "::error::platform-stack is not publicly pullable (set the package public in its settings)"; exit 1; }
