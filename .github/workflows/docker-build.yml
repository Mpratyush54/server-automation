name: Build and Publish Docker Images

on:
  push:
    branches: [ "master" ]
    tags: [ "v*.*.*" ]
    paths:
      - "platform/api/**"
      - "platform/portal/**"
      - "platformctl/profile-ingest/**"
      - "platformctl/internal/profileproxy/**"
      - "platformctl/go.mod"
      - ".github/workflows/docker-build.yml"
      - ".trivyignore"
  pull_request:
    branches: [ "master" ]
    paths:
      - "platform/api/**"
      - "platform/portal/**"
      - "platformctl/profile-ingest/**"
      - "platformctl/internal/profileproxy/**"
      - "platformctl/go.mod"
      - ".github/workflows/docker-build.yml"
      - ".trivyignore"
  workflow_dispatch:

# Deny by default; each job asks for what it needs.
permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: mpratyush54
  # Identity used by cosign keyless signing / verify (must match Kyverno attestor).
  COSIGN_CERTIFICATE_IDENTITY_REGEXP: https://github.com/Mpratyush54/server-automation/\.github/workflows/.*
  COSIGN_CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./platform/api
            file: ./platform/api/Dockerfile
            image: platform-api
          - name: portal
            context: ./platform/portal
            file: ./platform/portal/Dockerfile
            image: platform-portal
          # Profile ingest proxy for the full telemetry profile (platformctl module).
          - name: profile-ingest
            context: ./platformctl
            file: ./platformctl/profile-ingest/Dockerfile
            image: platform-profile-ingest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Pull requests: build locally (amd64) and scan; never push or sign.
      - name: Build (PR, local load)
        id: build_pr
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          load: true
          push: false
          tags: local/${{ matrix.image }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Build and push
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Resolve image reference for scan
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "target=local/${IMAGE}:scan" >> "$GITHUB_OUTPUT"
            echo "digest=" >> "$GITHUB_OUTPUT"
            echo "signed_ref=" >> "$GITHUB_OUTPUT"
          else
            if [ -z "$DIGEST" ]; then
              echo "::error::build-push-action did not emit a digest"
              exit 1
            fi
            ref="${REGISTRY}/${IMAGE_PREFIX}/${IMAGE}"
            echo "target=${ref}@${DIGEST}" >> "$GITHUB_OUTPUT"
            echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
            echo "signed_ref=${ref}@${DIGEST}" >> "$GITHUB_OUTPUT"
          fi

      # Human-readable findings in the job log (never fails); the gate below
      # writes SARIF, which does not show which package needs fixing.
      - name: Trivy findings (table)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.target }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: "0"
          vuln-type: os,library

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.target }}
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          exit-code: "1"
          vuln-type: os,library
          # Without this, SARIF output ignores `severity` and the gate fails
          # on HIGH findings too; the policy is CRITICAL with a fix.
          limit-severities-for-sarif: true
          # The table step above already installed Trivy and fetched the DB.
          skip-setup-trivy: true

      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      - name: Generate CycloneDX SBOM
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.target }}
          format: cyclonedx
          output: sbom-${{ matrix.image }}.cdx.json
          exit-code: "0"
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Sign image and attest SBOM (keyless)
        if: github.event_name != 'pull_request'
        env:
          DIGEST_REF: ${{ steps.ref.outputs.signed_ref }}
          IMAGE_NAME: ${{ matrix.image }}
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cosign sign --yes "$DIGEST_REF"
          cosign attest --yes --type cyclonedx --predicate "sbom-${IMAGE_NAME}.cdx.json" "$DIGEST_REF"
          {
            echo "### Signed ${IMAGE_NAME}"
            echo ""
            echo "- Ref: \`$DIGEST_REF\`"
            echo "- SBOM: CycloneDX attestation attached"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Append digests to release notes
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          IMAGE_NAME: ${{ matrix.image }}
          DIGEST_REF: ${{ steps.ref.outputs.signed_ref }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG not found yet; skipping notes update"
            exit 0
          fi
          notes="$(gh release view "$TAG" --json body -q .body)"
          block="$(printf '\n### Image signatures\n- `%s`\n' "$DIGEST_REF")"
          if printf '%s' "$notes" | grep -Fq "$DIGEST_REF"; then
            echo "Digest already recorded in release notes"
            exit 0
          fi
          if printf '%s' "$notes" | grep -Fq "### Image signatures"; then
            new_notes="$(printf '%s\n- `%s`\n' "$notes" "$DIGEST_REF")"
          else
            new_notes="$(printf '%s%s' "$notes" "$block")"
          fi
          gh release edit "$TAG" --notes "$new_notes"

  make-packages-public:
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Make GHCR packages public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          for pkg in platform-api platform-portal platform-profile-ingest; do
            echo "Setting visibility for $pkg..."
            gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/user/packages/container/${pkg}/visibility" \
              -f visibility=public \
              || gh api \
                --method PUT \
                -H "Accept: application/vnd.github+json" \
                "/orgs/${OWNER}/packages/container/${pkg}/visibility" \
                -f visibility=public \
              || echo "WARN: could not set $pkg public (may already be public or need manual toggle)"
          done
