name: release platformctl

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: platformctl/go.sum

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.22.1

      # Regenerate the embedded pre-pull image list from the pinned charts so
      # the released binary always matches internal/versions.
      - name: Generate image list
        run: scripts/gen-images.sh

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
          workdir: platformctl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
