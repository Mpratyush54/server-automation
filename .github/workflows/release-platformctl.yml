name: release platformctl

# Every tag is published as a GitHub pre-release (platformctl/.goreleaser.yaml).
# e2e-vm.yml, triggered by the same tag push, promotes a stable vX.Y.Z to the
# Latest release (and the GHCR "latest" copy) only after the e2e VM suite
# passes on both install profiles. See docs/operations/e2e-ci.md.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: platformctl/go.mod
          cache-dependency-path: platformctl/go.sum

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.22.1

      # Fail if the committed image list does not match the pinned charts.
      - name: Check image list
        run: scripts/gen-images.sh --check

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
          workdir: platformctl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Copy of the release on GHCR: install.sh falls back to it when GitHub
      # Releases is unavailable. oras comes from the Go module proxy, not from
      # GitHub Releases.
      - name: Mirror platformctl to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          go install oras.land/oras/cmd/oras@v1.2.3
          export PATH="$(go env GOPATH)/bin:$PATH"
          echo "$GITHUB_TOKEN" | oras login ghcr.io -u "$ACTOR" --password-stdin
          version="${TAG#v}"
          ref="ghcr.io/mpratyush54/platformctl"
          cd platformctl/dist
          files=(checksums.txt "platformctl_${version}_linux_amd64.tar.gz" "platformctl_${version}_linux_arm64.tar.gz")
          ls -l "${files[@]}"
          oras push "$ref:$version" --artifact-type application/vnd.platform.platformctl.v1 "${files[@]}"
          # "latest" moves only when e2e-vm.yml promotes a stable release after a
          # passing e2e run, matching GitHub's releases/latest (release gate, #25).
          gh api --method PUT "/user/packages/container/platformctl/visibility" -f visibility=public \
            || echo "::warning::set ghcr.io/mpratyush54/platformctl public in its Package settings"

  # Offline bundle (issue #12): k3s airgap images + chart tarballs + platform
  # images. Independent of goreleaser; waits for the release GoReleaser creates
  # and attaches platform-bundle-<tag>-<arch>.tar.zst (+ .sha256).
  # arm64 runs on the amd64 runner: `docker pull --platform linux/arm64` only
  # fetches layers, so no QEMU is needed.
  bundle:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      HELM_VERSION: v3.22.1
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: platformctl/go.mod
          cache-dependency-path: platformctl/go.sum

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # build-bundle.sh needs the classic image store: with the containerd
      # store, `docker save` of a --platform pull exports incomplete images.
      - name: Use Docker's classic image store
        run: |
          set -euo pipefail
          cfg=/etc/docker/daemon.json
          [ -s "$cfg" ] || echo '{}' | sudo tee "$cfg" >/dev/null
          sudo jq '.features = ((.features // {}) + {"containerd-snapshotter": false})' "$cfg" | sudo tee "$cfg.new" >/dev/null
          sudo mv "$cfg.new" "$cfg"
          sudo systemctl restart docker
          docker info --format '{{.Driver}} {{.DriverStatus}}'

      - name: Install helm, zstd and jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd jq
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar -xz -C /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version

      - name: Build bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/build-bundle.sh "$TAG" "${{ matrix.arch }}"

      - name: Upload workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: platform-bundle-${{ matrix.arch }}
          path: |
            dist/platform-bundle-*.tar.zst
            dist/platform-bundle-*.tar.zst.sha256
          retention-days: 7

      - name: Upload to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
        run: |
          # The goreleaser job creates the release; wait up to 30 min for it.
          for i in $(seq 1 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            echo "release $TAG not found yet (attempt $i/60); waiting 30s"
            sleep 30
          done
          gh release view "$TAG" >/dev/null
          f="dist/platform-bundle-${TAG}-${ARCH}.tar.zst"
          # The bundle exceeds GitHub's 2 GiB asset limit: publish its parts
          # (platformctl reassembles them) and the checksum of the whole file.
          ls -l "$f".part*
          for i in 1 2 3; do
            if gh release upload "$TAG" "$f".part* "$f.sha256" --clobber; then exit 0; fi
            echo "upload failed (attempt $i/3); retrying in 15s"
            sleep 15
          done
          exit 1
