name: Deploy Public Portal

on:
  push:
    branches: [ "master" ]
    paths:
      - "platform/portal/**"
      - "docs/**"
      - "scripts/tests/public-portal-routing.test.mjs"
      - ".github/workflows/deploy-public-portal.yml"
  workflow_dispatch:

# Deny by default; each job asks for what it needs.
permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: mpratyush54
  IMAGE_NAME: platform-portal-public

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js for routing tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Check public routes with nginx
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
          if [ -f platform/portal/package-lock.json ]; then
            npm ci --prefix platform/portal --no-audit --no-fund
          else
            echo "::warning::platform/portal has no package-lock.json; using npm install"
            npm install --prefix platform/portal --no-audit --no-fund
          fi
          node --test scripts/tests/public-portal-routing.test.mjs

      - name: Check docs navigation and landing page
        working-directory: platform/portal
        run: npm run test:public

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: platform/portal/Dockerfile.public
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
