# Local development only — NOT a production deployment.
#
# All ports are bound to 127.0.0.1 and every datastore requires credentials.
# Secrets come from a git-ignored `.env` next to this file; compose refuses to
# start while a required variable is missing. See
# docs/getting-started/installation.md ("Start the databases with Docker Compose").

services:
  postgres:
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: platform
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0.45
    environment:
      MONGO_INITDB_ROOT_USERNAME: platform
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db

  redis:
    image: redis:7.4.12-alpine3.21
    # `$$` defers expansion to the container shell, so the value comes from env.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    # minio/minio images are no longer published on Docker Hub; this is the
    # same (frozen) image the installer uses.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: platform
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - miniodata:/bitnami/minio/data

  loki:
    image: grafana/loki:2.9.17
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  prometheus:
    image: prom/prometheus:v3.16.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - promdata:/prometheus

  grafana:
    image: grafana/grafana:13.3.0
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}

  api:
    build:
      context: ./platform/api
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: platform
      MONGODB_URI: mongodb://platform:${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}@mongodb:27017/platform?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      LOKI_URL: http://loki:3100
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_started

  portal:
    build:
      context: ./platform/portal
      dockerfile: Dockerfile
    ports:
      # The portal image runs unprivileged nginx on 8080.
      - "127.0.0.1:4200:8080"
    depends_on:
      - api

volumes:
  pgdata:
  mongodata:
  miniodata:
  promdata:
